<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><title>Career Football</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1014;color:#f3f5f7;font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:230px;background:#11151a;border-right:1px solid #262c34;padding:18px;position:fixed;inset:0 auto 0 0}.logo{font-weight:900;font-size:19px;margin:5px 8px 24px}.logo i{color:#21c77b;font-style:normal}.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#aab2bd;padding:11px;border-radius:8px;margin:3px 0;font-weight:700}.nav button:hover,.nav button.on{background:#1c2229;color:#fff}.main{margin-left:230px;width:calc(100% - 230px)}header{height:62px;border-bottom:1px solid #262c34;display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;background:#0d1014f5;z-index:3}.content{max-width:1200px;margin:auto;padding:24px}.page{display:none}.page.on{display:block}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.card{background:#151a20;border:1px solid #292f37;border-radius:11px;padding:17px}.hero{background:#171d23;border:1px solid #2a323b;border-radius:12px;padding:22px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#929ba7}.big{font-size:29px;font-weight:900}.kpi{font-size:26px;font-weight:900}.label{font-size:11px;color:#929ba7;text-transform:uppercase;font-weight:800;letter-spacing:.06em;margin-bottom:8px}.btn{border:1px solid #303740;background:#1c2229;color:#fff;border-radius:8px;padding:10px 14px;font-weight:750}.btn.primary{background:#21c77b;border-color:#21c77b;color:#07130d}.btn.danger{color:#ff8f8f;background:#271719}.badge{border:1px solid #343b44;background:#1b2128;border-radius:99px;padding:4px 8px;font-size:12px}.green{color:#6fe6ad;border-color:#286145}.stat{display:grid;grid-template-columns:105px 1fr 30px;gap:8px;align-items:center;margin:10px 0}.bar{height:7px;background:#282f37;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#21c77b}.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:12px}.team{font-weight:850;font-size:17px}.score{font-size:29px;font-weight:900}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #292f37}th{color:#89929e;font-size:11px;text-transform:uppercase}input,select{width:100%;background:#0e1217;color:#fff;border:1px solid #303740;border-radius:8px;padding:10px}.form{display:grid;gap:12px}.event{padding:12px 0;border-bottom:1px solid #292f37}.event:last-child{border:0}.mobile{display:none}.toast{position:fixed;right:18px;bottom:18px;background:#20262e;border:1px solid #3a434e;padding:11px 14px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.2s;z-index:20}.toast.show{opacity:1;transform:none}@media(max-width:800px){.side{display:none}.main{margin:0;width:100%;padding-bottom:66px}.content{padding:15px 11px}header{padding:0 14px}.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.mobile{display:grid;position:fixed;bottom:0;left:0;right:0;height:62px;background:#11151a;border-top:1px solid #292f37;grid-template-columns:repeat(5,1fr);z-index:10}.mobile button{border:0;background:none;color:#89929d;font-size:10px;font-weight:800}.mobile button.on{color:#21c77b}.mobile b{display:block;font-size:18px;margin-bottom:2px}.team{font-size:13px}.big{font-size:24px}}
</style></head><body><div id="app"></div><div class="toast" id="toast"></div><script>
const KEY='careerFootballTestV1';const base={season:2026,week:1,focus:'Equilibrado',player:{name:'Ryan Silva',age:8,club:'Escolinha Sol Nascente',category:'Sub-9',position:'Ponta',foot:'Direito',number:7,overall:48,potential:82,morale:72,reputation:8,value:0,salary:0,stats:{speed:58,finishing:34,passing:42,dribbling:61,physical:36,defense:24,reflexes:18,intelligence:48,mentality:55},season:{apps:0,goals:0,assists:0,rating:0},career:{apps:0,goals:0,assists:0,rating:0}},fixtures:[],news:[],offers:[]};
function clone(x){return JSON.parse(JSON.stringify(x))}function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]=='object'&&!Array.isArray(b[k])&&a[k])a[k]=merge(a[k],b[k]);else a[k]=b[k]}return a}let S=(()=>{try{return merge(clone(base),JSON.parse(localStorage.getItem(KEY)||'null')||{})}catch{return clone(base)}})();let page='home';
function save(){localStorage.setItem(KEY,JSON.stringify(S));document.querySelector('#save').textContent='Salvo neste dispositivo'}function toast(x){let t=document.querySelector('#toast');t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1800)}function go(x){page=x;draw()}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const names={speed:'Velocidade',finishing:'Finalização',passing:'Passe',dribbling:'Drible',physical:'Físico',defense:'Defesa',reflexes:'Reflexos',intelligence:'Inteligência',mentality:'Mentalidade'};
function stats(){return Object.entries(S.player.stats).map(([k,v])=>`<div class="stat"><span>${names[k]}</span><div class="bar"><span style="width:${v}%"></span></div><b>${v}</b></div>`).join('')}
function overall(){let s=S.player.stats;let keys=['speed','finishing','passing','dribbling','physical','defense','intelligence','mentality'];S.player.overall=Math.round(keys.reduce((a,k)=>a+s[k],0)/keys.length)}
function fixture(){return S.fixtures.find(x=>!x.played)}function nav(id,txt,icon){return `<button class="${page==id?'on':''}" onclick="go('${id}')">${icon} ${txt}</button>`}function mobile(id,txt,icon){return `<button class="${page==id?'on':''}" onclick="go('${id}')"><b>${icon}</b>${txt}</button>`}
function draw(){document.querySelector('#app').innerHTML=`<aside class="side"><div class="logo">CAREER <i>FOOTBALL</i></div><div class="nav">${nav('home','Início','⌂')}${nav('calendar','Calendário','▦')}${nav('match','Partida','⚽')}${nav('training','Treinamento','↗')}${nav('market','Mercado','↔')}${nav('news','Notícias','▤')}${nav('table','Competições','▥')}${nav('profile','Perfil','◎')}${nav('history','Histórico','◷')}</div></aside><main class="main"><header><b>${({home:'Visão geral',calendar:'Calendário',match:'Partida',training:'Treinamento',market:'Mercado',news:'Notícias',table:'Competições',profile:'Perfil',history:'Histórico'})[page]}</b><span class="muted" id="save">Salvo neste dispositivo</span></header><section class="content">${pages[page]()}</section></main><nav class="mobile">${mobile('home','Início','⌂')}${mobile('calendar','Agenda','▦')}${mobile('match','Partida','⚽')}${mobile('market','Mercado','↔')}${mobile('profile','Perfil','◎')}</nav>`}
const pages={
home(){let f=fixture(),p=S.player;return `<div class="hero"><div class="row"><div><div class="muted">${esc(p.club)} · ${p.category}</div><div class="big">${esc(p.name)}</div><div class="muted">${p.age} anos · ${p.position} · ${p.foot}</div></div><div class="row"><div class="card"><div class="label">OVR</div><div class="kpi">${p.overall}</div></div><div class="card"><div class="label">POT</div><div class="kpi">${p.potential}</div></div></div></div></div><br><div class="grid g4"><div class="card"><div class="label">Moral</div><div class="kpi">${p.morale}%</div></div><div class="card"><div class="label">Reputação</div><div class="kpi">${p.reputation}</div></div><div class="card"><div class="label">Temporada</div><div class="kpi">${S.season}</div></div><div class="card"><div class="label">Jogos</div><div class="kpi">${p.season.apps}</div></div></div><br><div class="grid g2"><div class="card"><div class="label">Próxima partida</div>${f?`<div class="match"><div class="team">${f.home}</div><div class="score">×</div><div class="team">${f.away}</div></div><br><button class="btn primary" style="width:100%" onclick="go('match')">Abrir partida</button>`:'Nenhuma partida pendente.'}</div><div class="card"><div class="label">Atributos</div>${stats()}</div></div>`},
calendar(){return `<div class="row"><div><h1>Calendário</h1><p class="muted">Semana ${S.week} · temporada ${S.season}</p></div><button class="btn primary" onclick="advance()">Avançar semana</button></div><br><div class="card">${S.fixtures.map(f=>`<div class="event"><div class="row"><b>Semana ${f.week}</b><span class="badge ${f.played?'green':''}">${f.played?'Finalizado':'Agendado'}</span></div><div class="match"><div class="team">${f.home}</div><div class="score">${f.played?f.hs+' × '+f.as:'×'}</div><div class="team">${f.away}</div></div></div>`).join('')}</div>`},
match(){let f=fixture();if(!f)return `<div class="card"><h1>Sem partida pendente</h1><p class="muted">Avance a temporada.</p><button class="btn primary" onclick="advance()">Avançar</button></div>`;if(f.week>S.week)return `<div class="card"><h1>Próxima partida</h1><p class="muted">Semana ${f.week}. Você está na semana ${S.week}.</p><button class="btn primary" onclick="advanceTo(${f.week})">Avançar até o jogo</button></div>`;return `<div class="card"><div class="label">Competição de base</div><div class="match"><div class="team">${f.home}</div><div class="score">×</div><div class="team">${f.away}</div></div><br><div class="row"><button class="btn" onclick="simulate()">Simular partida</button><button class="btn primary" onclick="play()">Jogar momentos-chave</button></div></div>`},
training(){return `<div class="row"><div><h1>Treinamento</h1><p class="muted">O treino é automático.</p></div></div><br><div class="grid g2"><div class="card"><div class="label">Foco</div><select id="focus">${['Equilibrado','Velocidade','Finalização','Passe','Drible','Físico','Defesa','Mentalidade'].map(x=>`<option ${S.focus==x?'selected':''}>${x}</option>`).join('')}</select><br><br><button class="btn primary" onclick="setFocus()">Salvar foco</button></div><div class="card"><div class="label">Desenvolvimento</div><p>Overall <b>${S.player.overall}</b> · Potencial <b>${S.player.potential}</b></p><div class="bar"><span style="width:${S.player.overall}%"></span></div></div></div><br><div class="card"><div class="label">Atributos</div>${stats()}</div>`},
market(){return `<div class="row"><div><h1>Mercado</h1><p class="muted">Propostas de teste e contrato.</p></div><button class="btn" onclick="offer()">Gerar proposta</button></div><br><div class="grid g2"><div class="card"><div class="label">Contrato atual</div><p>Clube: <b>${S.player.club}</b></p><p>Salário: <b>€${S.player.salary}/mês</b></p><p>Valor: <b>€${S.player.value}</b></p></div><div class="card"><div class="label">Propostas</div>${S.offers.length?S.offers.map((o,i)=>`<div class="event"><div class="row"><b>${o.club}</b><span>€${o.fee}</span></div><p class="muted">Salário €${o.salary}/mês</p><button class="btn primary" onclick="accept(${i})">Aceitar</button> <button class="btn" onclick="reject(${i})">Recusar</button></div>`).join(''):'Nenhuma proposta.'}</div></div>`},
news(){return `<h1>Notícias</h1><p class="muted">Acontecimentos da carreira.</p><br><div class="card">${S.news.slice().reverse().map(n=>`<div class="event"><b>${esc(n.text)}</b><div class="muted">Semana ${n.week}</div></div>`).join('')}</div>`},
table(){let clubs=['Sol Nascente Sub-9','Estrela Mirim','União Kids','Projeto Bola','Academia Jovem','Real Kids'];return `<h1>Competições</h1><p class="muted">Tabela de teste da categoria ${S.player.category}.</p><br><div class="card"><table><thead><tr><th>#</th><th>Clube</th><th>J</th><th>PTS</th></tr></thead><tbody>${clubs.map((c,i)=>`<tr><td>${i+1}</td><td>${c}</td><td>${Math.max(0,S.week-1-i)}</td><td>${Math.max(0,(S.week-1-i)*3)}</td></tr>`).join('')}</tbody></table></div>`},
profile(){let p=S.player;return `<div class="hero"><div class="row"><div><div class="muted">${p.club}</div><div class="big">${esc(p.name)}</div><div class="muted">${p.age} anos · ${p.position} · camisa ${p.number}</div></div><div class="kpi">${p.overall} OVR</div></div></div><br><div class="grid g2"><div class="card"><div class="label">Atributos</div>${stats()}</div><div class="card"><div class="label">Informações</div><p>Potencial: <b>${p.potential}</b></p><p>Moral: <b>${p.morale}%</b></p><p>Reputação: <b>${p.reputation}/100</b></p><p>Valor: <b>€${p.value}</b></p><p>Posição: <b>${p.position}</b></p></div></div>`},
history(){let p=S.player;return `<h1>Histórico</h1><p class="muted">Resumo da carreira.</p><br><div class="grid g4"><div class="card"><div class="label">Jogos</div><div class="kpi">${p.career.apps}</div></div><div class="card"><div class="label">Gols</div><div class="kpi">${p.career.goals}</div></div><div class="card"><div class="label">Assist.</div><div class="kpi">${p.career.assists}</div></div><div class="card"><div class="label">Temporada</div><div class="kpi">${S.season}</div></div></div><br><div class="card"><div class="label">Linha do tempo</div>${S.news.slice().reverse().map(n=>`<div class="event"><b>S${n.week}</b> — ${esc(n.text)}</div>`).join('')}</div><br><button class="btn danger" onclick="resetCareer()">Apagar carreira local</button>`}
};
function setupFixtures(){if(S.fixtures.length)return;S.fixtures=[{week:2,home:'Sol Nascente Sub-9',away:'Estrela Mirim',played:false},{week:4,home:'União Kids',away:'Sol Nascente Sub-9',played:false},{week:6,home:'Sol Nascente Sub-9',away:'Projeto Bola',played:false},{week:8,home:'Academia Jovem',away:'Sol Nascente Sub-9',played:false},{week:10,home:'Sol Nascente Sub-9',away:'Real Kids',played:false}];if(!S.news.length)S.news=[{week:1,text:'Você iniciou sua carreira no futebol em uma escolinha.'}];overall();save()}
function advanceTo(n){while(S.week<n)advance(true);draw();toast('Chegou à semana da partida')}
function advance(silent=false){S.week++;let p=S.player;let map={Equilibrado:'intelligence',Velocidade:'speed',Finalização:'finishing',Passe:'passing',Drible:'dribbling',Físico:'physical',Defesa:'defense',Mentalidade:'mentality'};let k=map[S.focus],gap=Math.max(0,p.potential-p.overall);if(gap>0&&Math.random()<.7){p.stats[k]=Math.min(99,p.stats[k]+1);overall()}if(S.week>52){S.season++;S.week=1;p.age++;p.category=p.age<11?'Sub-9':p.age<13?'Sub-11':p.age<15?'Sub-13':p.age<17?'Sub-15':p.age<20?'Sub-17':p.age<23?'Sub-20':'Profissional';p.season={apps:0,goals:0,assists:0,rating:0};S.news.push({week:1,text:`Nova temporada: você agora tem ${p.age} anos e está no ${p.category}.`});S.fixtures=[];setupFixtures()}save();if(!silent){draw();toast('Semana avançada')}}
function setFocus(){S.focus=document.querySelector('#focus').value;save();toast('Foco atualizado');draw()}
function result(){let p=S.player,base=Math.max(0,Math.round(1+Math.random()*2)),g=Math.random()<(p.overall/180)?1:0,a=Math.random()<(p.stats.passing/300)?1:0,r=Math.min(10,Math.max(4,5.5+(p.overall-40)/25+Math.random()*1.6+g*1.2+a*.5));return{g,a,r,hs:base+g,as:Math.round(Math.random()*2)}}
function finish(r,events){let f=fixture(),p=S.player;if(!f)return;Object.assign(f,{played:true,hs:r.hs,as:r.as});p.season.apps++;p.season.goals+=r.g;p.season.assists+=r.a;p.season.rating+=r.r;p.career.apps++;p.career.goals+=r.g;p.career.assists+=r.a;p.career.rating+=r.r;p.morale=Math.max(0,Math.min(100,Math.round(p.morale+(r.r-6)*3)));p.reputation=Math.max(0,Math.min(100,p.reputation+(r.r>8?1:.2)));p.value=Math.round(p.overall*p.overall*Math.max(1,p.reputation));S.news.push({week:S.week,text:`${p.name} teve nota ${r.r.toFixed(1)} na partida.${r.g?' ⚽ Marcou '+r.g+' gol.':''}`});save();draw();toast('Partida encerrada')}
function play(){finish(result(),[])}function simulate(){finish(result(),[])}function offer(){let clubs=['Benfica','Ajax','Porto','Borussia Dortmund','Palmeiras','Corinthians','Real Sociedad'];let c=clubs[Math.floor(Math.random()*clubs.length)];S.offers.push({club:c,fee:Math.max(1000,Math.round(S.player.overall*S.player.overall*4)),salary:Math.max(300,Math.round(S.player.overall*15))});save();draw();toast('Nova proposta recebida')}
function accept(i){let o=S.offers[i],old=S.player.club;S.player.club=o.club;S.player.salary=o.salary;S.player.value=o.fee;S.offers.splice(i,1);S.news.push({week:S.week,text:`Transferência: ${S.player.name} deixou ${old} e assinou com ${o.club}.`});save();draw();toast('Transferência concluída')}
function reject(i){S.offers.splice(i,1);save();draw();toast('Proposta recusada')}
function resetCareer(){if(confirm('Apagar a carreira salva neste dispositivo?')){localStorage.removeItem(KEY);S=clone(base);setupFixtures();page='home';draw();toast('Carreira apagada')}}
setupFixtures();draw();
</script></body></html>
